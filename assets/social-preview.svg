<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jan Kazimierczak Engineering Science Portfolio</title>
  <desc id="desc">A warm technical grid with Jan Kazimierczak's name and the words analysis, design, prototype, and test.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#101c26" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f4f0e8"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="62" r="210" fill="#17616b" fill-opacity=".11"/>
  <circle cx="75" cy="610" r="240" fill="#b45d34" fill-opacity=".12"/>
  <path d="M82 86h58" stroke="#b45d34" stroke-width="4"/>
  <text x="158" y="94" fill="#0d4650" font-family="IBM Plex Mono, monospace" font-size="23" font-weight="600" letter-spacing="3">ENGINEERING SCIENCE PORTFOLIO</text>
  <text x="78" y="260" fill="#101c26" font-family="Space Grotesk, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-4">Jan Kazimierczak</text>
  <text x="82" y="345" fill="#46535c" font-family="IBM Plex Sans, Arial, sans-serif" font-size="37">Engineering work from analysis to physical proof.</text>
  <line x1="82" y1="438" x2="1118" y2="438" stroke="#101c26" stroke-opacity=".28"/>
  <text x="82" y="501" fill="#101c26" font-family="IBM Plex Mono, monospace" font-size="25" font-weight="600">01  ANALYZE</text>
  <text x="350" y="501" fill="#101c26" font-family="IBM Plex Mono, monospace" font-size="25" font-weight="600">02  DESIGN</text>
  <text x="616" y="501" fill="#101c26" font-family="IBM Plex Mono, monospace" font-size="25" font-weight="600">03  PROTOTYPE</text>
  <text x="946" y="501" fill="#101c26" font-family="IBM Plex Mono, monospace" font-size="25" font-weight="600">04  TEST</text>
  <rect x="82" y="555" width="1036" height="3" fill="#101c26"/>
  <rect x="82" y="555" width="278" height="3" fill="#b45d34"/>
</svg>
